locale: en-US
site_theme: default
title: Cao Group
title_separator: '|'
name: Cao Group
description: 'The Cao Group at SCUT: multiscale biocatalyst design, intelligent enzyme engineering, and sustainable
  biosynthesis.'
url: https://thu-caoyf.github.io
baseurl: /Group-Cao.github.io
repository: THU-caoyf/Group-Cao.github.io
timezone: Asia/Shanghai
author:
  avatar: cao-group.svg
  name: Cao Group
  bio: Multiscale biocatalysis · Enzyme design · Food biotechnology
  location: Guangzhou, China
  employer: South China University of Technology
  email: yufeicao@scut.edu.cn
  github: THU-caoyf
  googlescholar: https://scholar.google.com/citations?user=3ebq8z8AAAAJ&hl=en
  orcid: https://orcid.org/0000-0002-4742-4009
publication_category:
  manuscripts:
    title: Journal Articles
  conferences:
    title: Conference Papers
  books:
    title: Books
breadcrumbs: false
words_per_minute: 160
future: false
read_more: disabled
talkmap_link: false
atom_feed:
  hide: false
comments:
  provider: false
analytics:
  provider: false
social:
  type: Organization
  name: Cao Group
include:
- _pages
- files
exclude:
- .asset-cache
- .bundle
- .github
- .jekyll-cache
- .sass-cache
- AGENTS.md
- CONTENT_GUIDE.md
- Dockerfile
- docker-compose.yml
- docker-compose.yaml
- Gemfile
- Gemfile.lock
- LICENSE
- README.md
- package.json
- package-lock.json
- node_modules
- vendor
- local
- 资料
- log
- tmp
- markdown_generator
- talkmap
- talkmap.py
- talkmap.ipynb
- talkmap_out.ipynb
- .devcontainer
- assets/js/_main.js
- assets/js/plugins
- assets/js/vendor
encoding: utf-8
markdown_ext: markdown,mkdown,mkdn,mkd,md
markdown: kramdown
highlighter: rouge
excerpt_separator: '


  '
incremental: false
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
collections:
  publications:
    output: true
    permalink: /publication/:path/
defaults:
- scope:
    path: ''
    type: pages
  values:
    layout: single
    author_profile: true
- scope:
    path: ''
    type: posts
  values:
    layout: single
    author_profile: true
    comments: false
    share: false
    related: false
- scope:
    path: ''
    type: publications
  values:
    layout: single
    author_profile: true
    comments: false
    share: false
sass:
  sass_dir: _sass
  style: compressed
permalink: /news/:year/:month/:day/:title/
plugins:
- jekyll-feed
- jekyll-gist
- jekyll-paginate
- jekyll-sitemap
- jekyll-redirect-from
- jemoji
whitelist:
- jekyll-feed
- jekyll-gist
- jekyll-paginate
- jekyll-sitemap
- jekyll-redirect-from
- jemoji
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
compress_html:
  clippings: all
  ignore:
    envs: development
