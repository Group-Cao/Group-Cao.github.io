intro: We design enzyme catalysts across molecular, nanoscale, and mesoscale environments. By combining mechanistic
  simulation, protein engineering, and materials chemistry, we develop biocatalytic systems for sustainable synthesis
  and food biotechnology.
affiliation: School of Food Science and Engineering, South China University of Technology
research:
- id: confinement
  title: Multiscale confinement and biocatalyst materials
  question: How do spatial organization and local environments control enzyme catalysis?
  description: We study how confinement changes enzyme conformations, active-site preorganization, and the movement
    of substrates and intermediates. Our work connects molecular mechanisms to the design of enzyme–material interfaces
    and organized multienzyme systems.
  topics:
  - Mechanisms of confinement-induced activity and stability
  - Protein-directed mineralization and enzyme encapsulation in MOFs and COFs
  - Spatial organization, substrate channeling, and cascade catalysis
  image: /images/research/multiscale-confinement.webp
  image_alt: Molecular, nanoscale, and multienzyme strategies for controlling enzyme catalysis
  image_source: https://doi.org/10.1038/s44160-025-00898-1
  image_credit: Cao et al., Nature Synthesis (2025)
  papers:
  - 10.1038/s44160-025-00898-1
  - 10.1021/acsnano.5c13712
  - 10.1016/S1872-2067(25)64827-3
- id: enzyme-design
  title: Mechanism-guided and AI-assisted enzyme design
  question: Can we improve enzyme function by understanding the motions and interactions that enable catalysis?
  description: We combine molecular dynamics, reaction-mechanism calculations, and machine learning with experimental
    screening. These tools help us identify useful sequence changes, understand activity–stability relationships,
    and expand substrate scope and selectivity.
  topics:
  - Enzyme dynamics and catalysis at solid–liquid interfaces
  - Sequence–structure–function relationships and data-assisted engineering
  - Integrated computational prediction and experimental validation
  image: /images/research/enzyme-design.webp
  image_alt: PET hydrolase interacting with a polymer surface
  image_source: https://doi.org/10.1002/anie.202511131
  image_credit: Chen et al., Angewandte Chemie International Edition (2025)
  papers:
  - 10.1002/anie.202511131
  - 10.1039/D5GC03435C
- id: hybrid-catalysis
  title: Chemoenzymatic and electrobiocatalytic synthesis
  question: How can biological and chemical catalysts work together in compatible reaction environments?
  description: We investigate hybrid catalysts and reaction platforms that connect the selectivity of enzymes with
    chemical and electrochemical transformations. Our interests include enzyme–metal interactions, compartmentalized
    reactions, and the upgrading of simple carbon feedstocks.
  topics:
  - Cooperative enzyme–metal catalysis and artificial catalytic microenvironments
  - Multiphase reaction systems and Pickering emulsions
  - Electrochemical carbon conversion coupled with biocatalysis
  image: /images/research/hybrid-catalysis.webp
  image_alt: Bio–nano interactions and protein participation in metal–organic framework formation
  image_source: https://doi.org/10.1021/acsnano.5c13712
  image_credit: Qiao et al., ACS Nano (2025)
  papers:
  - 10.1016/j.cej.2025.167562
  - 10.1039/D5IM00356C
- id: food-biotechnology
  title: Sustainable biosynthesis and food biotechnology
  question: How can engineered enzymes and cells provide efficient routes to useful food and bioactive molecules?
  description: We develop enzyme cascades and microbial pathways for terpenoids, flavonoids, rare ginsenosides,
    and related compounds. Our wider food-biotechnology interests include functional materials, molecular recognition,
    food analysis, and the use of computational methods to understand and improve these systems.
  topics:
  - Pathway engineering and orthogonal precursor supply in yeast
  - Enzyme fusion and immobilization for selective biotransformation
  - Functional food ingredients, food analysis, and data-informed biotechnology
  image: /images/research/biosynthesis.webp
  image_alt: Engineering metabolic routes for biosynthesis in yeast
  image_source: https://doi.org/10.1038/s41467-024-54298-8
  image_credit: Li et al., Nature Communications (2024)
  papers:
  - 10.1038/s41467-024-54298-8
  - 10.1016/j.cej.2026.173977
  - 10.1021/acs.jafc.6c09373
