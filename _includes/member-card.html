{% assign person = include.person %}
{% capture profile_url %}/people/{{ person.id }}/{% endcapture %}
<section class="lab-member" id="{{ person.id }}" aria-labelledby="{{ person.id }}-name">
  <a class="lab-member-link" href="{{ profile_url | relative_url }}">
  <div class="lab-member-heading">
    <img class="lab-member-photo" src="{{ person.photo | relative_url }}" alt="" width="{{ person.photo_width }}" height="{{ person.photo_height }}" loading="lazy" decoding="async">
    <div>
      <h3 id="{{ person.id }}-name">{{ person.name }} <span lang="zh">{{ person.name_zh }}</span></h3>
      <p class="lab-member-role">{{ person.role }}</p>
      <p class="lab-member-year">{{ person.year }}</p>
    </div>
  </div>
  <p class="lab-member-research">{{ person.research | escape }}</p>
  </a>
</section>
